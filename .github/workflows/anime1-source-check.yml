name: Anime1 source checks

on:
  push:
    branches: [main]
    paths:
      - 'py/anime1.py'
      - 'tests/test_anime1.py'
      - 'wang-movie.json'
      - '.github/workflows/anime1-source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Python compile check
        run: python -m py_compile py/anime1.py tests/test_anime1.py
      - name: Network-free source tests
        run: python -m unittest discover -s tests -p 'test_anime1.py' -v
      - name: Configuration placement and JSON check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('wang-movie.json').read_text(encoding='utf-8'))
          sites = config['sites']
          keys = [site['key'] for site in sites]
          assert keys.count('anime1') == 1
          i = keys.index('红果短剧')
          assert keys[i + 1] == 'anime1', keys[i:i+3]
          assert sites[i+1]['api'] == './py/anime1.py'
          print('Anime1 configured after Hongguo:', sites[i+1])
          PY
