name: Hongguo one-shot live model probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hongguo-live-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Install FFmpeg for actual two-second video decode
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Verify public 360p source and its actual video dimensions
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("hongguo", "py/红果短剧.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          try:
              url = module._public_web_media_url("7699003626647194649")
              info = module._public_mp4_info(url)
              print("PUBLIC_WIDTH=" + str(info["width"]))
              print("PUBLIC_HEIGHT=" + str(info["height"]))
              print("PUBLIC_CODEC=" + info["codec"])
              if info["quality"] != 360:
                  raise module.HongguoPluginError("actual resolution differs from 360P")
              print("PUBLIC_METADATA_VERIFIED=true")
          except Exception as error:
              print("PUBLIC_SOURCE_PROBE=unavailable")
              print("PUBLIC_ERROR_CLASS=" + type(error).__name__)
              if isinstance(error, module.HongguoPluginError):
                  print("PUBLIC_REASON=" + str(error)[:150])
              raise SystemExit(3)
          PY
