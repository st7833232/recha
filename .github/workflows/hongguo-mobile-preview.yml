name: Hongguo public playback on mobile simulators
on:
  push:
    branches: ["codex/hongguo-web-public-v1"]
    paths:
      - "py/红果短剧.py"
      - "tests/hongguo_public_native/**"
      - ".github/workflows/hongguo-mobile-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-avplayer:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Start an iPhone and exercise AVPlayer
        run: |
          set -euo pipefail
          src="$PWD/tests/hongguo_public_native"
          tmp="$(mktemp -d)"
          xcrun simctl list devices available -j > "$tmp/devices.json"
          phone="$(python -c 'import json,sys; d=json.load(open(sys.argv[1]))["devices"]; print(next(v["udid"] for rt,ds in reversed(list(d.items())) if ".iOS-" in rt for v in ds if v["name"].startswith("iPhone")))' "$tmp/devices.json")"
          xcrun simctl boot "$phone" || xcrun simctl list devices booted | grep -F "$phone"
          xcrun simctl bootstatus "$phone" -b
          xcrun --sdk iphonesimulator swiftc -swift-version 5 -target "$(uname -m)-apple-ios17.0-simulator" "$src/AVProbe.swift" -o "$tmp/probe"
          for ep in 1 3; do
            python "$src/media.py" "$ep" "$tmp/media.json"
            echo "Episode $ep"
            xcrun simctl spawn "$phone" "$tmp/probe" "$tmp/media.json"
          done
  android-media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Enable hardware virtualization for the Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: bash tests/hongguo_public_native/android.sh
