name: Hongguo Python playback checks
on:
  push:
    branches: [main, "codex/hongguo-web-public-v1"]
    paths:
      - "py/红果短剧.py"
      - "tests/test_hongguo_v5.py"
      - ".github/workflows/hongguo-playback-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: python -m pip install requests
      - name: Ensure FFmpeg for ordinary clear MP4 fixtures
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Python syntax
        run: python -m py_compile "py/红果短剧.py"
      - name: Offline playback contract tests
        run: python -m unittest discover -s tests -p 'test_hongguo_v5.py' -v

      - name: Decode the official public sample on the preview branch
        if: github.ref == 'refs/heads/codex/hongguo-web-public-v1'
        run: |
          python - <<'PY'
          import importlib.util
          import subprocess

          source = importlib.util.spec_from_file_location("hg", "py/红果短剧.py")
          plugin = importlib.util.module_from_spec(source)
          source.loader.exec_module(plugin)
          spider = plugin.Spider()
          sid = "7706908220253555737"
          row = spider.detailContent([sid])["list"][0]
          lines = dict(zip(row["vod_play_from"].split("$$$"), row["vod_play_url"].split("$$$")))
          public = lines.get(plugin._PUBLIC_LINE, "")
          slots = dict(part.split("$", 1) for part in public.split("#") if "$" in part)
          print("Publicly linked episodes:", sorted(slots), flush=True)
          assert "1" in slots and "3" in slots, "The public sample has changed or could not be read"
          for index in ("1", "3"):
              source = spider.playerContent(plugin._PUBLIC_LINE, slots[index])
              assert source.get("parse") == 0 and source.get("url"), "No public MP4 for episode " + index
              assert source.get("quality") == "360P"
              headers = "".join(k + ": " + v + "\r\n" for k, v in source["header"].items())
              probe = subprocess.run(
                  ["ffmpeg", "-nostdin", "-loglevel", "error", "-rw_timeout", "10000000",
                   "-headers", headers, "-i", source["url"], "-map", "0:v:0", "-frames:v", "1",
                   "-f", "framehash", "-"],
                  capture_output=True, text=True, timeout=30)
              assert probe.returncode == 0 and any(line.startswith("0,") for line in probe.stdout.splitlines()), "No decoded video frame"
              print("Episode", index, source["width"], source["height"], source["codec"], "frame decoded", flush=True)
          PY
