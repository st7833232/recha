name: KKYS poster diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'py/kkys.py'
      - '.github/workflows/kkys-poster-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Check poster parsing and public image responses
        run: |
          python - <<'PY'
          import importlib.util, sys, types, re
          import requests
          from urllib.parse import urlsplit
          base = types.ModuleType('base')
          stub = types.ModuleType('base.spider')
          class Spider:
              def log(self, x): print(x)
          stub.Spider = Spider
          sys.modules['base'] = base
          sys.modules['base.spider'] = stub
          spec = importlib.util.spec_from_file_location('kkys', 'py/kkys.py')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          print('POSTER SELF CHECK:', m._poster_self_check())
          s = m.Spider()
          headers = {'User-Agent': m.UA, 'Referer': m.SITE + '/'}
          for path in ['/show/1-----3-1.html', '/detail/390043.html']:
              try:
                  r = requests.get(m.SITE + path, headers=headers, timeout=12)
                  print('PAGE', path, r.status_code, len(r.content), r.url)
                  print('RDUL declarations', [x[:500] for x in re.findall(r'\bRDUL\s*=\s*[^;\n]+', r.text)[:4]])
                  print('resolved image host', m._image_host(r.text))
                  root = m._parse_dom(r.text)
                  imgs = m._find_all(root, tag='img')
                  for img in imgs[:12]:
                      print('IMG', {k: v[:350] for k,v in img.attrs.items() if k in ('src','srcset','class','data-original','data-src','data-lazy-src','data-srcset','data-url','data-pic')})
                  if path.startswith('/detail'):
                      box = m._first(m._find_all(root, cls='detail-pic'))
                      pics = [s._poster(box, r.url, m._image_host(r.text))] if box else []
                  else:
                      pics = [v.get('vod_pic','') for v in s._parse_list(r.text,r.url)][:5]
                  for pic in pics:
                      print('PARSED', pic)
                      if not pic or not pic.startswith(('https://','http://')): continue
                      for h in ({}, headers):
                          try:
                              with requests.get(pic,headers=h,timeout=7,stream=True) as im:
                                  print('IMAGE',bool(h),im.status_code,im.headers.get('Content-Type'),next(im.iter_content(16),b'').hex())
                          except requests.RequestException as e:
                              print('IMAGE ERROR',type(e).__name__)
              except requests.RequestException as e:
                  print('PAGE ERROR',type(e).__name__)
          PY
